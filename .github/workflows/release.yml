name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: |
            ~/.nix-profile
            ~/.nix-defexpr
            /nix/store
            /nix/var
          key: nix-store-${{ hashFiles('cross-build-*.nix', 'build-bluealsa-compat.sh') }}
          restore-keys: nix-store-

      - name: Cache Piper downloads
        uses: actions/cache@v4
        with:
          path: .cache/piper
          key: piper-armv7l-${{ hashFiles('package-for-kobo.sh') }}

      - name: Build bundle (espeak-ng + Piper)
        run: bash package-for-kobo.sh --with-piper --piper-voice en_US-danny-low

      - name: Build Android TTS helper (.dex)
        run: |
          # Install minimal Android SDK components for dex compilation
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME"
          # Download command-line tools (retry on transient failures, then
          # verify the archive before unzipping: dl.google.com occasionally
          # serves a truncated body or an error page, and curl -s hides it)
          CMDLINE_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          curl -sL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/cmdline-tools.zip "$CMDLINE_URL"
          unzip -tq /tmp/cmdline-tools.zip > /dev/null
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/"
          mv "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/cmdline-tools-tmp"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools-tmp/"* "$ANDROID_HOME/cmdline-tools/latest/"
          rmdir "$ANDROID_HOME/cmdline-tools-tmp"
          # Accept licenses and install build-tools + platform
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" > /dev/null 2>&1
          # Build the .dex
          cd android && bash build-dex.sh
          # Copy into the bundle
          cp tts_helper.dex media_session_helper.dex ../kobo-tts-bundle/audiobook.koplugin/android/

      - name: Verify bundle
        run: |
          PLUGIN_DIR="kobo-tts-bundle/audiobook.koplugin"
          EXPECTED_LUA_COUNT=31

          echo "=== Lua files ==="
          ls -la "$PLUGIN_DIR"/*.lua
          LUA_COUNT=$(ls -1 "$PLUGIN_DIR"/*.lua 2>/dev/null | wc -l)
          echo "Lua file count: $LUA_COUNT (expected $EXPECTED_LUA_COUNT)"
          if [ "$LUA_COUNT" -ne "$EXPECTED_LUA_COUNT" ]; then
              echo "ERROR: Expected $EXPECTED_LUA_COUNT Lua files, found $LUA_COUNT"
              exit 1
          fi
          echo ""

          echo "=== ffmpeg binary ==="
          if [ -f "$PLUGIN_DIR/bin/ffmpeg" ] || [ -f "$PLUGIN_DIR/bin/ffmpeg.bin" ]; then
              ls -la "$PLUGIN_DIR/bin/ffmpeg"* 2>/dev/null || true
              echo "ffmpeg: OK"
          else
              echo "ERROR: bin/ffmpeg missing"
              exit 1
          fi
          echo ""

          echo "=== espeak-ng binary + MBROLA ==="
          ls -la kobo-tts-bundle/audiobook.koplugin/espeak-ng/bin/
          echo ""
          echo "=== MBROLA voice databases ==="
          ls -la kobo-tts-bundle/audiobook.koplugin/espeak-ng/share/mbrola/ 2>/dev/null || true
          echo ""
          echo "=== Piper binary + voice ==="
          ls -la kobo-tts-bundle/audiobook.koplugin/piper/piper.bin
          ls -la kobo-tts-bundle/audiobook.koplugin/piper/*.onnx
          echo ""
          echo "=== BlueALSA (BT audio bridge) ==="
          ls -la kobo-tts-bundle/audiobook.koplugin/bluealsa/bin/
          ls -la kobo-tts-bundle/audiobook.koplugin/bluealsa/lib/alsa-lib/
          ls -la kobo-tts-bundle/audiobook.koplugin/bluealsa/lib/
          echo ""
          echo "=== Android TTS helper ==="
          ls -la kobo-tts-bundle/audiobook.koplugin/android/
          echo ""
          echo "=== Kindle GStreamer player ==="
          ls -la kobo-tts-bundle/audiobook.koplugin/kindle/
          echo ""
          echo "=== wav-play (ALSA player) ==="
          ls -la kobo-tts-bundle/audiobook.koplugin/wav-play/
          ls -la kobo-tts-bundle/audiobook.koplugin/wav-play/lib/ 2>/dev/null || true
          echo ""
          echo "=== Total size ==="
          du -sh kobo-tts-bundle/audiobook.koplugin/

      - name: Create zip
        run: |
          cd kobo-tts-bundle
          zip -r ../audiobook-koplugin-${{ github.ref_name }}.zip audiobook.koplugin/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: audiobook-koplugin-${{ github.ref_name }}.zip
          body: |
            ## Audiobook Read-Along ${{ github.ref_name }}

            **Download, unzip, and copy `audiobook.koplugin/` to your KOReader plugins directory. Restart KOReader.**

            ### Included
            - Plugin (all Lua files)
            - Bundled espeak-ng (cross-compiled for Kobo armv7l)
            - Bundled MBROLA voice support + 7 default voices (US English, French, German, Spanish, Chinese, Portuguese)
            - Bundled Piper neural TTS + en_US-danny-low voice
            - Bundled BlueALSA (BT audio bridge for BlueZ Kobo devices)
            - Bundled kindle-gst-play (GStreamer WAV player for Cat 2 Kindles)
            - Bundled kindle-gst-play-native (KinAMP-parity fallback for audio-less PW4-class Kindles)
            - Bundled wav-play (ALSA player for PocketBook and other devices without aplay)
            - Android TTS helper and MediaSession helpers (pre-built tts_helper.dex, media_session_helper.dex)

            ### Install paths
            | Platform | Path |
            |----------|------|
            | Kobo | `.adds/koreader/plugins/` |
            | Kindle | `koreader/plugins/` |
            | Linux | `~/.config/koreader/plugins/` |
            | Android | `/sdcard/koreader/plugins/` |

            See [README](https://github.com/${{ github.repository }}/blob/master/README.md) for full documentation.

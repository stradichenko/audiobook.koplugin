# cloud_tts.cfg —— 云端 TTS 中继配置（中继服务见仓库 relay/ 目录，或任意兼容接口）
# 由同目录的 cloud_tts_helper.sh 读取。修改后无需重启，下次朗读即生效。

# 中继基础地址：填「TTS 接口本身」的完整地址（含 /tts 这类路径），不含 ?voice=&text= 参数。
# voice 与 text 由 helper 自动按 GET 参数附加，不要写进本行。
#   例（局域网）     ： http://192.168.0.101:5000/tts
#   例（公网自建）   ： https://your-relay.example.com/tts
#   ⚠️ 只填域名根路径（如 https://your-relay.example.com ）会抓到网页而非音频 → 没声音！
#   ⚠️⚠️ 局域网中继【必须用 http:// 绝不能用 https://】！本地中继是纯 HTTP 服务，
#      若填 https://，curl 会先做 TLS 握手，中继收到的全是二进制握手包 →
#      中继控制台狂刷 “400 Bad request version ('\x16\x03\x01…')” → 所有请求全部失败 →
#      表现为「大段空白 + 跳段」（此问题与云端无关，云端 https 是正常的）。
RELAY_BASE=http://YOUR_RELAY_HOST:5000/tts

# ⚠️ 中继【必须返回 WAV】（Content-Type: audio/wav），不能返回 MP3！
#    本设备上没有可用的 ffmpeg（旧版会段错误崩溃），helper 无法把 MP3 转 WAV；
#    中继若返回 MP3，每段都会失败重试然后被跳过 → 「空白/跳段」。
#    参考中继（见仓库 relay/README.md，极简本地版在 relay/standalone/relay_server.py）
#    已实测返回 audio/wav（16kHz 单声道 16bit）✓，Kindle Oasis 直读可播；
#    若你的中继还在返回 MP3，需要把服务端改成「输出 WAV」（参考中继默认即如此）。

# 语音名（会作为 voice 参数传给中继）
VOICE=zh-CN-XiaoxiaoNeural

# 音量增益（可选，默认留空=不调整，最稳妥）。
# 设备本地无 ffmpeg（内核太老会崩），【无法在本地做音量增益】，只能靠中继端放大。
# 部分中继支持 Edge-TTS 风格的 volume 参数，可在此填（效果取决于你的中继是否转发该参数）：
#   +30%   响一点      -20%   轻一点
#   loud / x-loud     更响（命名档）
# ⚠️ 若填了之后反而无声/报错，说明你的中继不认 volume 参数 —— 改回留空即可恢复。
VOLUME=

# 请求方式：
#   get  —— 默认，标准 ?voice=..&text=.. 形式（推荐，兼容参考中继）
#   post —— 把整段文本作为 HTTP body 发送，无需编码（需要中继另开接收原始正文的接口）
METHOD=get

# 单次连接超时（秒）
# 实测：中继正常时单句 2~14s 返回（长句更久）。30s 太长——一旦中继慢，单次就吃掉大半个
# 总预算，重试也来不及。降到 20s：正常请求绝不受影响，异常时能更快重试。
# 真正兜底的是下面的 TOTAL_BUDGET（45s），单次超时会按剩余预算自动收缩。
TIMEOUT=20

# 失败重试次数（仅当单次仍超时/失败才重试；能兜住 Render 冷启动的第一次超时）。
# 不再需要靠 TIMEOUT×(RETRIES+1) 去凑 60s —— 总耗时由 TOTAL_BUDGET 硬约束。
# 保留 2 次重试即可（配合 TIMEOUT=20，正常路径 <45s）。
RETRIES=2

# 并发闸门：同时打中继的最大进程数（默认 2）。
# audiobook 会把长文切成几十段、瞬间并发打几十次请求，免费托管（Render 等）一高并发就
# 过载，表现为「跳段 + 乱码」。helper 用【原子目录锁】把真正打中继的并发硬限到这个数，
# 其余进程排队（旧版用“计数后建文件”有竞态，多个进程会同时越过限制→闸门形同虚设，正是
# “信号量没用”的根因）。值越小越稳（中继越不易过载），但长文尾部等待越久。
# 若你的中继很稳（自托管/付费），可调到 4~6 提速；若仍跳段/乱码，调到 1 最稳。
# 说明：当前版本【预取已默认开启】（NATIVE_PREFETCH_ENABLED=true），靠 idx 安全队列 +
# 预取空文件校验防止跳句；并行打中继的进程数略高，故 2~3 都安全；若仍跳段/乱码，回调 1~2。
MAX_CONCURRENT=3

# 单个 helper 等待闸门的最长时间（秒）。超时则加随机抖动后“尽力而为”直接打（宁可偶发过载
# 也不让该段必被跳过）。⚠️ 该值本身会与其它等待叠加，故真正兜底靠下面的 TOTAL_BUDGET。
LOCK_WAIT=12

# ⚠️⚠️⚠️ 硬总时限（秒）—— 解决「自动暂停」的关键项。
# 现象：原来乱码的位置现在变成【自动暂停】（播放器停在原地不再推进）。
# 根因：audiobook 等待 helper 的上限约 60s（ttsengine.lua:_synthesizeNativeOneshot 里
#   max_polls=120 × 0.5s）。若 helper 超过 60s 才结束，audiobook 判超时 → callback(false)
#   → 播放器停在原地。而旧版 helper 的多个等待会【叠加】：
#     acquire_hashlock(LOCK_WAIT) + acquire_slot(LOCK_WAIT) × 每轮 + curl(TIMEOUT) × (RETRIES+1)
#     + backoff  ⇒ 最坏可达 ~141s，远超 60s。
# 方案：TOTAL_BUDGET 给 helper 设一个【绝对总预算】。从启动起所有等待/超时都按「剩余预算」
#   动态收缩，预算耗尽立即停止重试并退出，保证任何路径下都远早于 60s 上限。
# 取值：45s（留 ~15s 给 audiobook 轮询 / 音频校验 / UI 推进）。设 0 表示关闭该限制（回到旧行为）。
TOTAL_BUDGET=45

# ---------------------------------------------------------------------------
# 输出格式（本版本为【直接透传】，以下两项已不再使用，仅保留作兼容占位）
# ---------------------------------------------------------------------------
# 本 helper 不再做任何转码：云端中继（Edge-TTS 类）直接返回 WAV，且本设备（墨水屏/Kindle
# 等）实测能直接播放该 WAV，故原样透传。变速通过中继的 rate 参数实现，不依赖本地 ffmpeg。
# （旧版曾用插件自带 bin/ffmpeg 转码，但它在你的老内核设备上会段错误崩溃，已彻底弃用。）
OUT_RATE=22050
OUT_CHANNELS=1

# ---------------------------------------------------------------------------
# 排错
# ---------------------------------------------------------------------------
# 每次朗读都会在【插件目录】里生成 cloud_tts_last.log（固定文件名、覆盖式），记录：
# 中继地址、HTTP 返回大小、是否走了闸门/变速、是否检测到截断重试等。若仍有跳段/乱码，
# 先看这个 log：
#   - relay 返回 size=0 / ascii 是错误网页  -> 中继没跑或地址不对 / 设备无法访问公网
#   - TRUNCATED wav                          -> 中继过载返回了残破音频，已重试（仍频繁可调小 MAX_CONCURRENT）
#   - semaphore: waited ... best-effort      -> 并发太高、闸门排队超时，可把 MAX_CONCURRENT 调小
#   - FAILED after retries                   -> 该段彻底失败，audiobook 会跳过它（这就是「跳段」根因之一）
